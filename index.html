(function(){
 var D=JSON.parse(document.getElementById('d').textContent);
 var KEY='rmdl.pw', DAYS=30;
 function b2a(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
 function saved(){
  try{var o=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!o||Date.now()>o.exp){localStorage.removeItem(KEY);return null}
      return o.pw}catch(e){return null}
 }
 function remember(pw){
  try{localStorage.setItem(KEY,JSON.stringify({pw:pw,exp:Date.now()+DAYS*864e5}))}catch(e){}
 }
 function open_(pw,before){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
  .then(function(k){return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b2a(D.s),iterations:D.n,hash:'SHA-256'},k,
    {name:'AES-GCM',length:256},false,['decrypt'])})
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(D.i)},k,b2a(D.c))})
  .then(function(buf){return new TextDecoder('utf-8').decode(buf);})
  .then(function(html){if(before)before();document.open();document.write(html);document.close();});
 }

   : '이 브라우저가 암호 해제를 지원하지 않습니다. 최신 브라우저로 열어주세요.';
 else if(!window.TextDecoder) why='이 브라우저가 너무 오래됐습니다. 최신 브라우저로 열어주세요.';
 if(why){

 }
 var sp=saved();
 if(sp){
  document.getElementById('f').hidden=true;

    localStorage.removeItem(KEY);
    document.getElementById('auto').hidden=true;
    document.getElementById('f').hidden=false;

 }
 document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var btn=document.getElementById('b'),err=document.getElementById('e');
  btn.disabled=true;btn.textContent='해독 중';err.textContent='';

    document.getElementById('p').select();});
 });
})();
